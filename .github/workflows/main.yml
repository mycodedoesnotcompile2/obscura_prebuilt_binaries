name: Build binary

on:
  workflow_dispatch
  # schedule:
  #  - cron: '5 5 * * *'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  OBSCURA_ROOT_DIR: /tmp/obscura
  OBSCURA_BIN_NAME: obscura
  OBSCURA_REPO: https://github.com/h4ckf0r0day/obscura.git
  APT: sudo apt -y -qq -o=Dpkg::Use-Pty=0
  CHOCO: choco install -y -r --no-progress

  CFLAGS_i686_unknown_linux_musl: "-msse2"
  CXXFLAGS_i686_unknown_linux_musl: "-msse2"

defaults:
  run:
    shell: bash

jobs:
  checkout:
    runs-on: ubuntu-latest
    outputs:
      OBSCURA_PREBUILT_LATEST_TAG: ${{ steps.release_latest_tag.outputs.OBSCURA_PREBUILT_LATEST_TAG }}
      OBSCURA_CURRENT_COMMIT_ID: ${{ steps.release_commit_id.outputs.OBSCURA_CURRENT_COMMIT_ID }}
      OBSCURA_VERSION: ${{ steps.release_commit_id.outputs.OBSCURA_VERSION }}

    steps:
      - name: Get latest release tag of this repo
        id: release_latest_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/

          OBSCURA_PREBUILT_LATEST_TAG=$(gh release list \
            -R mycodedoesnotcompile2/obscura_prebuilt_binaries \
            --json tagName \
            -L 1 \
            --jq '.[].tagName' \
            --exclude-drafts \
            --exclude-pre-releases)

          echo "OBSCURA_PREBUILT_LATEST_TAG=$OBSCURA_PREBUILT_LATEST_TAG" >> $GITHUB_OUTPUT
          echo "OBSCURA_PREBUILT_LATEST_TAG=$OBSCURA_PREBUILT_LATEST_TAG" >> $GITHUB_ENV

      - name: Clone repo and check if there is a new and uncompiled yet version
        id: release_commit_id
        run: |
          cd /tmp/
          git clone --depth=1 "$OBSCURA_REPO" "$OBSCURA_BIN_NAME"
          
          cd "$OBSCURA_ROOT_DIR"
          
          git fetch --tags
          OBSCURA_VERSION=$(git tag --sort=-version:refname | head -n 1)
          git checkout "$OBSCURA_VERSION"
          
          OBSCURA_CURRENT_COMMIT_ID=$(git rev-parse --short HEAD)
          echo "OBSCURA_CURRENT_COMMIT_ID=$OBSCURA_CURRENT_COMMIT_ID" >> $GITHUB_ENV
          echo "OBSCURA_CURRENT_COMMIT_ID=$OBSCURA_CURRENT_COMMIT_ID" >> $GITHUB_OUTPUT
          
          echo "OBSCURA_VERSION=$OBSCURA_VERSION" >> $GITHUB_OUTPUT
          echo "OBSCURA_VERSION=$OBSCURA_VERSION" >> $GITHUB_ENV
          
          # case: no new commit => abort the workflow
          if [[ $OBSCURA_PREBUILT_LATEST_TAG == $OBSCURA_CURRENT_COMMIT_ID ]]; then
            echo "[!] No new version to compile"
            exit 100
          fi

      # - name: Get version
      #   id: release_version_cargo_get
      #   uses: nicolaiunrein/cargo-get@master
      #   with:
      #     subcommand: workspace.package.version
      #     options: --entry "$OBSCURA_ROOT_DIR/Cargo.toml"

      # - name: Set OBSCURA_VERSION build variable
      #   id: release_version
      #   run: |
      #     OBSCURA_VERSION=${{ steps.release_version_cargo_get.outputs.metadata }}
      #     echo "OBSCURA_VERSION=$OBSCURA_VERSION" >> $GITHUB_OUTPUT


  build:
    needs: checkout

    strategy:
      fail-fast: false
      matrix:
        include:
          - TARGET: x86_64-unknown-linux-musl
            OS: ubuntu-latest
            #CC_COMPILER: cross
            
          - TARGET: x86_64-unknown-linux-gnu
            OS: ubuntu-latest
            
          - TARGET: i686-unknown-linux-gnu
            OS: ubuntu-latest
            CC_PKG: gcc-multilib g++-multilib

          # - TARGET: i686-unknown-linux-musl
          #   OS: ubuntu-latest
          #   CC_COMPILER: cross
          #   CC_PKG: gcc-multilib g++-multilib
          
          - TARGET: aarch64-unknown-linux-musl
            OS: ubuntu-24.04-arm
            #OS: ubuntu-latest
            #CC_COMPILER: cross
            
          - TARGET: aarch64-unknown-linux-gnu
            OS: ubuntu-24.04-arm
          
          # - TARGET: armv7-unknown-linux-musleabihf
          #   OS: ubuntu-latest
          #   CC_COMPILER: cross
          
          - TARGET: armv7-unknown-linux-gnueabihf
            OS: ubuntu-latest
            #CC_PKG: crossbuild-essential-armhf
            CC_COMPILER: cross

          - TARGET: arm-unknown-linux-musleabihf
            OS: ubuntu-latest
            CC_COMPILER: cross
          
          - TARGET: arm-unknown-linux-gnueabihf
            OS: ubuntu-latest
            CC_PKG: gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf

          - TARGET: arm-unknown-linux-musleabi
            OS: ubuntu-latest
            CC_COMPILER: cross
          
          - TARGET: aarch64-apple-darwin
            OS: macos-latest

          - TARGET: x86_64-apple-darwin
            OS: macos-26-intel
          
          - TARGET: x86_64-pc-windows-msvc
            OS: windows-latest
            
          - TARGET: x86_64-pc-windows-gnu
            OS: windows-latest
            
          - TARGET: aarch64-pc-windows-msvc
            OS: windows-11-arm
          # ------------------------------

          - TARGET: x86_64-unknown-freebsd
            OS: ubuntu-latest
            CC_COMPILER: cross
            
          - TARGET: riscv64gc-unknown-linux-gnu
            OS: ubuntu-latest
            CC_PKG: gcc-riscv64-linux-gnu

          - TARGET: riscv64gc-unknown-linux-musl
            OS: ubuntu-latest
            CC_COMPILER: cross

          - TARGET: powerpc64le-unknown-linux-gnu
            OS: ubuntu-latest
            CC_COMPILER: cross

          - TARGET: aarch64-linux-android
            OS: ubuntu-latest
            CC_COMPILER: cross
            
          - TARGET: armv7-linux-androideabi
            OS: ubuntu-latest
            CC_COMPILER: cross
            
          - TARGET: mips64el-unknown-linux-gnuabi64
            OS: ubuntu-24.04
            CC_PKG: gcc-mips64el-linux-gnuabi64 g++-mips64el-linux-gnuabi64
           
          - TARGET: mips64el-unknown-linux-muslabi64
            OS: ubuntu-latest
            CC_COMPILER: cross


    runs-on: ${{ matrix.OS }}

    container:
      image: ${{ matrix.CONTAINER }}

    env:
      TARGET: ${{ matrix.TARGET }}
      OS: ${{ matrix.OS }}
      CONTAINER: ${{ matrix.CONTAINER }}
      CC_PKG: ${{ matrix.CC_PKG }}
      CC_COMPILER: ${{ matrix.CC_COMPILER }}
      CROSS_CONFIG: /tmp/cross.toml

      OBSCURA_PREBUILT_LATEST_TAG: ${{ needs.checkout.outputs.OBSCURA_PREBUILT_LATEST_TAG }}
      OBSCURA_VERSION: ${{ needs.checkout.outputs.OBSCURA_VERSION }}

    steps:
      - name: Clone repo
        run: |
          cd /tmp/
          git clone --depth=1 "$OBSCURA_REPO" "$OBSCURA_BIN_NAME"
          
          cd "$OBSCURA_BIN_NAME"
          git fetch --tags
          LATEST_TAG=$(git tag --sort=-version:refname | head -n 1)
          git checkout "$LATEST_TAG"

      - name: Install and configure dependencies
        run: |
          if [[ $OS == windows* ]]; then
            $CHOCO wget
          fi

          if [[ $OS == ubuntu* ]]; then
            $APT update
            #$APT install libssl-dev pkg-config libglib2.0-dev
          fi

          # for musl builds
          if [[ $TARGET == *"-musl"* ]]; then
            $APT install musl-tools
          fi

          # for everything else
          if [[ -n "${CC_PKG:-}" ]]; then
            $APT install $CC_PKG
          fi

          # for arm targets
          if [[ $TARGET == "arm"* ]]; then
            cd "$OBSCURA_ROOT_DIR"
            cargo install --force --locked bindgen-cli
          fi

          cargo install cross

          wget -nv "https://github.com/mycodedoesnotcompile2/rust_compile_config_files/raw/refs/heads/main/cross.toml" -O "$CROSS_CONFIG"
          wget -nv "https://github.com/mycodedoesnotcompile2/rust_compile_config_files/raw/refs/heads/main/config.toml" -O ~/.cargo/config.toml

      - name: Install rust target
        run: |
          if [[ $TARGET == "mips"* ]]; then
            rustup toolchain install nightly
            rustup component add rust-src --toolchain nightly
          else
            rustup target add $TARGET
          fi

      - name: Patch lto in Cargo.toml for mips
        run: |
          if [[ $TARGET == "mips"* ]]; then
            cd "$OBSCURA_ROOT_DIR"
            sed -i 's/^[[:space:]]*lto[[:space:]]*=.*/lto = false/' Cargo.toml
            grep -i lto Cargo.toml
          fi

      - name: Patch cross.toml for v8 compilation
        run: |
          # Pass V8_FROM_SOURCE into the cross container
          #sed -i '/^\[build\.env\]/a passthrough = ["V8_FROM_SOURCE"]' "$CROSS_CONFIG"
          cat >> "$CROSS_CONFIG" <<'EOF'
          
          [build.env]
          passthrough = ["V8_FROM_SOURCE"]
          EOF

          tail -n 5 "$CROSS_CONFIG"

      - name: Run build
        run: |
          cd $OBSCURA_ROOT_DIR
          
          if [[ -z "${CC_COMPILER:-}" ]]; then
            CC_COMPILER="cargo"
          fi
          
          if [[ $TARGET == "mips"* ]]; then
            $CC_COMPILER +nightly build -Z build-std=std,panic_abort --release -p obscura-cli --bins --features render,stealth --target $TARGET
          
          elif [[ $TARGET == "arm-"* || $TARGET == "armv7-"* ]]; then
            V8_FROM_SOURCE=1 $CC_COMPILER build --release -p obscura-cli --bins --features render,stealth --target $TARGET
          
          else
            $CC_COMPILER build --release -p obscura-cli --bins --features render,stealth --target $TARGET
          fi

      - name: List build information
        run: |
          OLD_OBSCURA_BIN_DIR="$OBSCURA_ROOT_DIR/target/$TARGET/release"
          OLD_OBSCURA_BIN_PATH="$OLD_OBSCURA_BIN_DIR/$OBSCURA_BIN_NAME"

          ls -alh "$OLD_OBSCURA_BIN_DIR"

          if [[ $TARGET == *-windows-* ]]; then
            OLD_OBSCURA_BIN_PATH="$OLD_OBSCURA_BIN_DIR/$OBSCURA_BIN_NAME.exe"
          fi

          OBSCURA_BIN_PATH="${{ runner.temp }}/$OBSCURA_BIN_NAME-$OBSCURA_VERSION-$TARGET-$TLS"

          if [[ $OS == windows* || $TARGET == *-windows-* ]]; then
            OBSCURA_BIN_PATH="${{ runner.temp }}/$OBSCURA_BIN_NAME-$OBSCURA_VERSION-$TARGET-$TLS.exe"
          fi

          OBSCURA_BIN_HASH_PATH="$OBSCURA_BIN_PATH.sha256.txt"
          cp -f "$OLD_OBSCURA_BIN_PATH" "$OBSCURA_BIN_PATH"
          ls -alh "$OBSCURA_BIN_PATH"
          cd "$(dirname "$OBSCURA_BIN_PATH")"
          sha256sum --tag "$(basename "$OBSCURA_BIN_PATH")" | tee "$OBSCURA_BIN_HASH_PATH"
          ldd "$OBSCURA_BIN_PATH" || true
          "$OBSCURA_BIN_PATH" -h || true

          echo "OBSCURA_BIN_PATH=$OBSCURA_BIN_PATH" >> $GITHUB_ENV
          echo "OBSCURA_BIN_HASH_PATH=$OBSCURA_BIN_HASH_PATH" >> $GITHUB_ENV

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.TARGET }}
          path: |
            ${{ env.OBSCURA_BIN_PATH }}
            ${{ env.OBSCURA_BIN_HASH_PATH }}

  deploy_release:
    needs: [checkout, build]
    runs-on: ubuntu-latest
    env:
      OBSCURA_CURRENT_COMMIT_ID: ${{ needs.checkout.outputs.OBSCURA_CURRENT_COMMIT_ID }}
      OBSCURA_VERSION: ${{ needs.checkout.outputs.OBSCURA_VERSION }}

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          merge-multiple: true
          path: /tmp/results

      - name: List target
        run: |
          cd "/tmp/results"
          ls -alh
          RELEASE_NOTES="/tmp/release_notes.txt"
          echo "RELEASE_NOTES=$RELEASE_NOTES" >> $GITHUB_ENV
          
          cat *.sha256.txt > "$RELEASE_NOTES"
          sha256sum -c *.sha256.txt
          
          mkdir -p "/tmp/hashes"
          mv -f *.sha256.txt "/tmp/hashes/"

      - name: Create a new Github release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 #v3.0.3
        with:
          make_latest: true
          body_path: ${{ env.RELEASE_NOTES }}
          name: version ${{ env.OBSCURA_VERSION }} - build ${{ env.OBSCURA_CURRENT_COMMIT_ID }}
          tag_name: ${{ env.OBSCURA_CURRENT_COMMIT_ID }}
          files: |
            /tmp/results/${{ env.OBSCURA_BIN_NAME }}-*
